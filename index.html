
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker King</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08251b;
      color: white;
      text-align: center;
    }

    header {
      background: #124b32;
      padding: 25px;
      border-bottom: 3px solid gold;
    }

    h1 { color: gold; }

    .coins {
      margin: 25px;
      font-size: 22px;
      color: gold;
    }

    .table {
      margin: 25px auto;
      width: 280px;
      height: 180px;
      background: #087448;
      border: 8px solid #98632f;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cards { font-size: 38px; margin: 15px; }

    button {
      display: block;
      width: 80%;
      max-width: 300px;
      margin: 15px auto;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: gold;
      color: #10271c;
      font-size: 18px;
      font-weight: bold;
    }

    #message { color: gold; padding: 15px; }
  </style>
</head>
<body>

  <header>
    <h1>👑 POKER KING</h1>
    <p>Play • Enjoy • Connect</p>
  </header>

  <div class="coins">
    🪙 Coins: <span id="coins">1000</span>
  </div>

  <div class="table">
    <h3>POKER TABLE</h3>
    <div class="cards">🂠 🂠 🂠</div>
    <p>Ready to Play?</p>
  </div>

  <button onclick="playGame()">🎮 PLAY NOW</button>
  <button onclick="bonus()">🎁 DAILY BONUS</button>
  <button onclick="profile()">👤 MY PROFILE</button>

  <p id="message">Welcome to Poker King!</p>

  <script>
    let coins = 1000;
    let claimed = false;

    function playGame() {
      document.getElementById("message").textContent =
        "Poker table ready! Multiplayer coming soon.";
    }

    function bonus() {
      if (claimed) {
        document.getElementById("message").textContent =
          "Bonus already claimed!";
        return;
      }

      coins += 500;
      claimed = true;
      document.getElementById("coins").textContent = coins;
      document.getElementById("message").textContent =
        "Congratulations! 500 bonus coins received!";
    }

    function profile() {
      document.getElementById("message").textContent =
        "Guest Player | Coins: " + coins;
    }
  </script>

</body>
</html>
